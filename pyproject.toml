[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dualview_isac"
version = "0.1.0"
description = "Cross-view self-supervised CSI and radar signal representation implementation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "matplotlib>=3.7", "scikit-learn>=1.3"]

[project.scripts]
dualview_isac = "dualview_isac.cli:main"

[tool.setuptools.packages.find]
include = ["dualview_isac*"]
